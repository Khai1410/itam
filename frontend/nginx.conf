server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        # $http_host (not $host) keeps the port the browser actually used
        # (e.g. localhost:8080) — the backend needs it intact to build a
        # correct Azure SSO redirect_uri.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
