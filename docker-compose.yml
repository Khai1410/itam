name: itam

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-itam}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itam} -d ${POSTGRES_DB:-itam}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-itam}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-itam}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-jwt-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      EMPLOYEE_EMAIL_DOMAIN: ${EMPLOYEE_EMAIL_DOMAIN:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_ORG_NAME: ${ORG_NAME:-}
        VITE_SENDER_NAME: ${SENDER_NAME:-}
        VITE_SENDER_TITLE: ${SENDER_TITLE:-}
        VITE_SENDER_ADDRESS: ${SENDER_ADDRESS:-}
        VITE_SENDER_MOBILE: ${SENDER_MOBILE:-}
        VITE_SENDER_EMAIL: ${SENDER_EMAIL:-}
        VITE_SENDER_WEB: ${SENDER_WEB:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  db_data:
